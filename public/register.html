<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrarse | API REST Films</title>

    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <main class="login">
        <section class="login__card">

            <p class="login__eyebrow">
                Crear cuenta
            </p>

            <h1>API REST FILMS</h1>

            <p class="login__description">
                Registrate para acceder al catálogo de películas.
            </p>

            <form id="register-form" class="auth-form">

                <label for="name">
                    Nombre
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required
                >

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <label for="confirm-password">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirmPassword"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <button type="submit">
                    Crear cuenta
                </button>

            </form>

            <p id="register-message" role="alert"></p>

            <p class="login__description">
                ¿Ya tenés una cuenta?
                <a href="/login.html">Ingresar</a>
            </p>

        </section>
    </main>

    <script src="./js/register.js"></script>
</body>
</html>
