<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Rest Films</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/estilos.css" />
</head>

<body>
    <div class="session-bar">
        <div id="currentUser"></div>

        <div class="session-actions">
            <div id="adminAccess"></div>

            <button
                id="logoutButton"
                class="session-button"
                type="button"
            >
                Cerrar sesión
            </button>
        </div>
    </div>

    <div id="adminAccess"></div>
    <header class="marquesina">
        <div class="marquesina__luces"></div>
        <h1>API REST FILMS</h1>
        <p>Catálogo privado de películas</p>
        
    </header>

    <main class="cine">
        <section class="cartelera">
            <h2>Ahora en cartelera: Semana de Harry El Sucio</h2>

            <div class="galeria" id="galeria"></div>
        </section>
        <section class="sugerencias">
            <h2>Comentarios y sugerencias</h2>
        
            <p>
                Podés sugerir una película o dejarnos un comentario.
            </p>
        
            <form id="suggestionForm">
                <textarea id="suggestionMessage" placeholder="Escribí tu mensaje..." maxlength="500" required></textarea>
        
                <button type="submit">
                    Enviar
                </button>
        
                <p id="suggestionStatus"></p>
            </form>
        </section>
        </main>

    <footer>
        <p>© 2026 API REST FILMS</p>
    </footer>
    <script src="./js/auth.js"></script>
    <script src="./js/films.js"></script>
</body>
</html>
