<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña | API REST Films</title>

    <link rel="stylesheet" href="./css/login.css">
</head>

<body>

    <main class="login">

        <section class="login__card">

            <p class="login__eyebrow">
                Recuperar acceso
            </p>

            <h1>API REST FILMS</h1>

            <p class="login__description">
                Ingresá tu correo electrónico y te enviaremos instrucciones
                para restablecer tu contraseña.
            </p>

            <form
                id="forgot-password-form"
                class="auth-form"
            >

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >

                <button type="submit">
                    Enviar enlace
                </button>

            </form>

            <p
                id="forgot-password-message"
                role="alert"
            ></p>

            <p class="login__description">
                <a href="/login.html">
                    ← Volver al login
                </a>
            </p>

        </section>

    </main>

    <script src="./js/forgot-password.js"></script>

</body>

</html>
