<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ingresar | API REST Films</title>

    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <main class="login">
        <section class="login__card">
            <p class="login__eyebrow">Catálogo privado</p>

            <h1>API REST FILMS</h1>

            <p class="login__description">
                Ingresá con tu cuenta para acceder a las películas.
            </p>

            <form id="login-form" class="auth-form">
                <label for="email">Correo electrónico</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >

                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">Ingresar</button>
            </form>

            <p id="login-message" role="alert"></p>
            <p class="login__description">
    <a href="/forgot-password.html">
        ¿Olvidaste tu contraseña?
    </a>
</p>
<p class="login__description">
    <a href="#" id="resendVerificationLink">
        ¿No recibiste el correo de verificación?
    </a>
</p>
        </section>
    </main>

    <script src="./js/auth.js"></script>
    <script src="./js/login.js"></script>
</body>
</html>
